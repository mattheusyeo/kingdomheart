<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product – Kingdomheart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Cinzel:wght@500&family=Outfit:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-bar">
      <a href="index.html" class="logo">Kingdomheart</a>
      <a href="cart.html" class="cart-link" aria-label="Cart, empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="cart-count" hidden>0</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="nav-items" id="menu" aria-label="Main">
      <a href="gallery.html?category=lifestyle">Lifestyle</a>
      <a href="gallery.html?category=stationery">Stationery</a>
      <a href="gallery.html?category=accessories">Accessories</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="product-wrap" id="product-wrap">
    <a class="product-back" id="product-back" href="gallery.html">&larr; Back</a>
    <div class="product" id="product-root" aria-live="polite">
      <noscript><p>Please turn on JavaScript to see this product.</p></noscript>
    </div>
  </main>

  <footer class="footer" id="contact">
    <div class="footer-card">
      <img class="footer-img" src="assets/footer.jpg" alt="Orange flower">
      <div class="footer-inner">
        <p class="monogram">KH.</p>
        <div class="footer-row">
          <p>Miami, FL</p>
          <a href="mailto:hello@example.com">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/product.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
