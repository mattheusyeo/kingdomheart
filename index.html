<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingdomheart</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <a href="/" class="logo">KINGDOMHEART</a>

      <form class="search" role="search" action="#" onsubmit="return false;">
        <input type="search" name="q" placeholder="What are you looking for?" aria-label="Search">
        <button type="submit" aria-label="Submit search">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="10" cy="10" r="7"></circle>
            <line x1="15.2" y1="15.2" x2="22" y2="22"></line>
          </svg>
        </button>
      </form>

      <div class="promo">
        <svg class="promo-mark" width="14" height="36" viewBox="0 0 14 36" aria-hidden="true">
          <path d="M10 1 C2 8, 12 16, 5 22 C1 26, 6 32, 3 35" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="promo-text">
          <span class="promo-title">FREE SHIPPING</span>
          <span class="promo-sub">FOR ORDERS $25 &amp; ABOVE</span>
        </div>
      </div>
    </div>

    <nav class="main-nav" aria-label="Main">
      <ul>
        <li><a href="#makeup">Makeup</a></li>
        <li><a href="#skincare">Skincare</a></li>
        <li><a href="#accessories">Accessories</a></li>
      </ul>
    </nav>
  </header>
</body>
</html>
